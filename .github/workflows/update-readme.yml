name: Update README statistics

on:
  push:
    branches: [main, redesign-readme]
    paths:
      - '**.cpp'
      - 'scripts/update_readme.py'
      - '.github/workflows/update-readme.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Refresh README statistics
        run: python scripts/update_readme.py

      - name: Commit updated statistics
        run: |
          if git diff --quiet -- README.md; then
            echo "README statistics are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update README statistics"
          git push
